name: Build unsigned DGYShell.ipa

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build (unsigned)
        run: |
          set -e
          cd app
          xcodebuild \
            -project DGYShell.xcodeproj \
            -scheme DGYShell \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build \
            | xcpretty || xcodebuild -project DGYShell.xcodeproj -scheme DGYShell -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 build

      - name: Package IPA
        run: |
          set -e
          APP=$(find app/build -name "DGYShell.app" -maxdepth 6 | head -1)
          echo "APP=$APP"
          ls -la "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          # 清掉签名残留
          rm -rf out/Payload/DGYShell.app/_CodeSignature || true
          cd out
          zip -qry DGYShell-unsigned.ipa Payload
          ls -lh DGYShell-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DGYShell-unsigned-ipa
          path: out/DGYShell-unsigned.ipa
