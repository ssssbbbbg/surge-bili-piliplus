name: Build unsigned DGYShell.ipa

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Clean previous build output
        run: rm -rf app/build out

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          cd app
          xcodebuild \
            -project DGYShell.xcodeproj \
            -scheme DGYShell \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Verify binary exists
        run: |
          set -euo pipefail
          APP=$(find app/build -name "DGYShell.app" -type d -maxdepth 6 | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "::error::DGYShell.app not found"
            exit 1
          fi
          ls -la "$APP"
          if [ ! -f "$APP/DGYShell" ]; then
            echo "::error::executable DGYShell missing"
            exit 1
          fi
          file "$APP/DGYShell"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find app/build -name "DGYShell.app" -type d -maxdepth 6 | head -1)
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          rm -rf out/Payload/DGYShell.app/_CodeSignature || true
          cd out
          zip -qry DGYShell-unsigned.ipa Payload
          ls -lh DGYShell-unsigned.ipa

      - name: Verify IPA contents
        run: |
          set -euo pipefail
          unzip -l out/DGYShell-unsigned.ipa | tee /tmp/ipa.txt
          grep -q "Payload/DGYShell.app/DGYShell" /tmp/ipa.txt || {
            echo "::error::IPA missing executable"
            exit 1
          }

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DGYShell-unsigned-ipa
          path: out/DGYShell-unsigned.ipa
          if-no-files-found: error
