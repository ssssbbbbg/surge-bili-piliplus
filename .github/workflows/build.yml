name: Build BiliPiliAutoOpen.dylib

on:
  push:
    branches: [main]
    paths:
      - 'dylib/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-path

      - name: Compile dylib (arm64)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang++ -shared -fobjc-arc \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -framework UIKit -framework Foundation \
            -undefined dynamic_lookup \
            -o dylib/BiliPiliAutoOpen.dylib \
            dylib/BiliPiliAutoOpen.mm
          ls -lh dylib/BiliPiliAutoOpen.dylib
          file dylib/BiliPiliAutoOpen.dylib

      - name: Strip + verify
        run: |
          xcrun --sdk iphoneos strip -x dylib/BiliPiliAutoOpen.dylib || true
          # 确认没残留未定义符号之外的垃圾
          nm -u dylib/BiliPiliAutoOpen.dylib | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliPiliAutoOpen.dylib
          path: dylib/BiliPiliAutoOpen.dylib
